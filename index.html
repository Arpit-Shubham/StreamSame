<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StreamSame</title>
<meta name="description" content="Watch the same video together, perfectly in sync.">
<meta name="theme-color" content="#7a2350">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="glass bar">
    <a class="brand" href="./" aria-label="StreamSame home">
      <img src="favicon.svg" alt="" width="34" height="34">
      <span>StreamSame</span>
    </a>
    <span id="pill" class="pill">Not connected</span>
  </header>

  <main>
    <section id="lobby" class="glass hero">
      <h2>Press play together.</h2>
      <p class="sub">Start a room, share the code, and watch the same video at the same second, wherever you are.</p>
      <div class="row">
        <button id="btnHost" class="primary">Start a room</button>
        <span class="or">or join with a code</span>
        <input id="joinCode" placeholder="ABC123" maxlength="6" autocomplete="off" aria-label="Room code">
        <button id="btnJoin">Join</button>
      </div>
    </section>

    <section id="room" hidden>
      <div class="glass roombar">
        <span>Room code <strong id="roomCode">------</strong></span>
        <button id="btnCopy" class="ghost">Copy invite link</button>
      </div>

      <div id="stage" class="stage">
        <video id="video" playsinline preload="metadata"></video>
        <div id="empty" class="empty">Your video will appear here.</div>
        <div id="shield" class="shield">Waiting for your partner to catch up…</div>
        <div id="floaters" class="floaters" aria-hidden="true"></div>
        <div id="tray" class="tray" hidden>
          <button data-e="👍" aria-label="Thumbs up">👍</button>
          <button data-e="❤️" aria-label="Heart">❤️</button>
          <button data-e="😂" aria-label="Laugh">😂</button>
          <button data-e="😢" aria-label="Cry">😢</button>
        </div>
        <div class="controls">
          <button id="btnPlay" aria-label="Play or pause">Play</button>
          <span id="time" class="time">0:00 / 0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
          <input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
          <button id="btnReact" aria-label="Send a reaction">😊</button>
          <button id="btnFs" aria-label="Fullscreen">Full screen</button>
        </div>
      </div>

      <div class="glass source" id="source">
        <div class="seg" role="tablist">
          <button data-k="drive" class="on">Google Drive</button>
          <button data-k="url">Direct link</button>
        </div>
        <div id="srcDrive" class="srcpane">
          <input id="driveLink" placeholder="Paste a Drive share link (Anyone with the link)">
          <button id="loadDrive" class="primary">Load video</button>
        </div>
        <div id="srcUrl" class="srcpane" hidden>
          <input id="directLink" placeholder="https://…/movie.mp4">
          <button id="loadUrl" class="primary">Load video</button>
        </div>
      </div>
      <p id="msg" class="msg glass" role="status" hidden></p>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
