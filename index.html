<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couchsync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Couchsync</h1>
  <span id="pill" class="pill">Not connected</span>
</header>

<main>
  <section id="lobby" class="card">
    <h2>Watch the same file, at the same second.</h2>
    <p class="sub">Start a room and send the code to your partner, or enter the code you were sent.</p>
    <div class="row">
      <button id="btnHost" class="primary">Start a room</button>
      <span class="or">or</span>
      <input id="joinCode" placeholder="Room code" maxlength="6" autocomplete="off">
      <button id="btnJoin">Join</button>
    </div>
  </section>

  <section id="room" hidden>
    <div class="roombar">
      <div>Room code <strong id="roomCode">------</strong>
        <button id="btnCopy" class="ghost">Copy invite link</button></div>
    </div>

    <div id="stage" class="stage">
      <video id="video" playsinline preload="metadata"></video>
      <div id="empty" class="empty">Choose a video below to begin.</div>
      <div id="shield" class="shield">Waiting for your partner to catch up…</div>
      <div class="controls">
        <button id="btnPlay" aria-label="Play or pause">Play</button>
        <span id="time" class="time">0:00 / 0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
        <button id="btnFs" aria-label="Fullscreen">Full screen</button>
      </div>
    </div>

    <div class="card source" id="source">
      <div class="seg" role="tablist">
        <button data-k="drive" class="on">Google Drive</button>
        <button data-k="url">Direct link</button>
      </div>
      <div id="srcDrive" class="srcpane">
        <input id="driveLink" placeholder="Paste the Drive share link (set to “Anyone with the link”)">
        <button id="loadDrive" class="primary">Load video</button>
      </div>
      <div id="srcUrl" class="srcpane" hidden>
        <input id="directLink" placeholder="https://…/movie.mp4">
        <button id="loadUrl" class="primary">Load video</button>
      </div>
    </div>
    <p id="msg" class="msg" role="status"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
